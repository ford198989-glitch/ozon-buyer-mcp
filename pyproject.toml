[project]
name = "ozon-buyer-mcp"
version = "0.3.1"
description = "Read-only MCP server for Ozon buyer-side search, product details and reviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "playwright>=1.52.0",
  "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
ozon-buyer-mcp = "ozon_buyer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_buyer_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
